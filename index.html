<!DOCTYPE html>
<html>
<head>
    <title>Chat UTS</title>
    <style>
        #messages { border: 1px solid #ccc; height: 200px; overflow-y: auto; margin-bottom: 10px; padding: 10px; background: #f0f0f0; }
        input { padding: 10px; width: 250px; }
        button { padding: 10px; background: green; color: rgb(20, 18, 18); border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>WebSocket Experiment</h2>
    <div id="messages"></div>
    <input type="text" id="inputField" placeholder="Ketik di sini..." style="color: black !important; background: white !important;">
    <button id="sendBtn">Kirim</button>

    <script>
        const socket = new WebSocket('ws://localhost:5000');
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('inputField');
        const sendBtn = document.getElementById('sendBtn');

        socket.onmessage = (event) => {
            const p = document.createElement('p');
            p.textContent = "Pesan masuk: " + event.data;
            messagesDiv.appendChild(p);
        };

        sendBtn.onclick = () => {
            if (inputField.value) {
                socket.send(inputField.value);
                inputField.value = '';
            }
        };
    </script>
</body>
</html>
